<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-Time Chat Application">
    <title>{% block title %}Real-Time Chat{% endblock %}</title>

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --color-brand-50: #f8fafc;
            --color-brand-100: #f1f5f9;
            --color-brand-900: #0f172a;
        }

        body {
            font-family: var(--font-sans);
            @apply bg-slate-50 text-slate-900 antialiased min-h-screen selection:bg-slate-900 selection:text-white;
        }

        /* Custom subtle scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="flex flex-col min-h-screen">
    {% block content %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
